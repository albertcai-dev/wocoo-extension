<style>
  .sk { --bg:#f5f5f4; --card:#fff; --subtle:#fafaf9; --fg:#14110c; --fg2:#4d4842; --soft:#6b665e; --inact:#a39e96; --line:#dfdcd6;
        --pos:#148256; --posfg:#0e6f48; --posbg:rgba(20,130,86,.10); --warn:#b2691c; --warnfg:#8a4f15; --warnbg:rgba(178,105,28,.10);
        --neg:#c13c3c; --negfg:#a02f2f; --negbg:rgba(193,60,60,.10); --hl:#4b5cc3; --hlfg:#3a479c; --hlbg:rgba(75,92,195,.10);
        font-family: -apple-system, BlinkMacSystemFont, "Inter", sans-serif; color:var(--fg); background:var(--bg);
        width:380px; padding:14px; border-radius:10px; box-sizing:border-box; text-align:left; }
  .sk h4 { margin:0 0 8px; font-size:15px; font-weight:700; }
  .sk .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px; }
  .sk .row { display:flex; align-items:center; gap:6px; }
  .sk .title { font-size:13px; font-weight:700; }
  .sk .meta { font-size:11px; color:var(--soft); font-variant-numeric:tabular-nums; }
  .sk .nano { font-size:11px; color:var(--soft); line-height:1.4; }
  .sk .key { font-size:11px; font-weight:700; color:var(--hlfg); font-variant-numeric:tabular-nums; white-space:nowrap; }
  .sk .sum { font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; }
  .sk .divider { height:1px; background:var(--line); margin:10px 0; }
  .sk .label { font-size:10px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--inact); margin-bottom:6px; }
  .sk .tag { font-size:10px; font-weight:700; padding:1px 6px; border-radius:999px; background:var(--subtle); border:1px solid var(--line); color:var(--fg2); white-space:nowrap; }
  .sk .thin { height:4px; background:#ebe9e5; border-radius:2px; margin-top:8px; overflow:hidden; }
  .sk .thin > div { height:100%; border-radius:2px; }
  .sk .steps { margin:8px 0 0; padding:0; list-style:none; }
  .sk .steps li { display:flex; gap:8px; align-items:center; font-size:12px; padding:3px 0; color:var(--fg2); }
  .sk .dot { width:14px; height:14px; border-radius:50%; flex:none; display:flex; align-items:center; justify-content:center; font-size:9px; color:#fff; box-sizing:border-box; }
  .sk .d-done { background:var(--pos); }
  .sk .d-now { background:var(--hl); box-shadow:0 0 0 3px var(--hlbg); animation:pulse 1.6s infinite; }
  .sk .d-wait { background:var(--warn); box-shadow:0 0 0 3px var(--warnbg); }
  .sk .d-slow { background:var(--neg); box-shadow:0 0 0 3px var(--negbg); }
  .sk .d-skip { background:#fff; border:1.5px dashed var(--line); }
  .sk .d-todo { background:#fff; border:1.5px solid var(--line); }
  .sk .todo { color:var(--inact); }
  .sk .now { color:var(--fg); font-weight:700; }
  .sk .t { margin-left:auto; font-size:10px; color:var(--soft); font-variant-numeric:tabular-nums; white-space:nowrap; }
  .sk .q { display:flex; gap:8px; align-items:baseline; padding:3px 0; }
  .sk .q .n { font-size:10px; color:var(--inact); width:10px; flex:none; }
  .sk .bump { font-size:10px; padding:1px 5px; border-radius:4px; margin-left:auto; white-space:nowrap; flex:none; }
  .sk .b-solve { color:var(--hlfg); background:var(--hlbg); }
  .sk .b-compass { color:var(--warnfg); background:var(--warnbg); }
  .sk .b-reply { color:var(--posfg); background:var(--posbg); }
  .sk .more { font-size:11px; color:var(--hlfg); }
  .sk .note { margin-top:8px; font-size:11px; line-height:1.4; padding:6px 8px; border-radius:6px; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.55} }
  .grid { display:grid; grid-template-columns: repeat(auto-fit, minmax(400px, 1fr)); gap:20px; align-items:start; }
  .grid figure { margin:0; }
  .grid figcaption { font-size:13px; margin:0 0 6px; font-weight:600; }
  .grid figcaption span { font-weight:400; opacity:.75; }
</style>
